name: Aggiorna dati QuiSport
on:
  workflow_dispatch:
    inputs:
      league:
        description: 'Competizione (vuoto = tutte)'
        required: false
        default: ''
      rosters:
        description: 'Controllo completo dei dati disponibili'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: quisport-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verifica controlli e recupero automatico
        run: python3 updater/test_refresh.py
      - name: Escludi le vecchie rose dai file pubblici
        run: |
          python3 - <<'PYDATA'
          import json,pathlib
          for path in pathlib.Path('dist/data').glob('*.json'):
              value=json.loads(path.read_text())
              if value.get('schema')==1 and isinstance(value.get('clubs'),list):
                  value['clubs']=[{**{k:c[k] for k in ['name','slug','group','season'] if k in c},'players':[],'source':'','sourceLabel':'','checked':''} for c in value['clubs']]
                  path.write_text(json.dumps(value,ensure_ascii=False,separators=(',',':')))
          PYDATA
          # Stage only cleaned historical seeds before fetching SportScore data.
          git add dist/data/aa118803c292568d.json dist/data/54ded8193f16459a.json dist/data/bfa814178ca6b5fa.json
      - name: Aggiorna e conserva le ultime versioni valide
        id: update
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          LEAGUE: ${{ inputs.league }}
          ROSTERS: ${{ inputs.rosters }}
        run: |
          args=()
          if [ -n "$LEAGUE" ]; then args+=(--league "$LEAGUE"); fi
          if [ "$ROSTERS" = "true" ] || [ "$(date -u +%H)" = "03" ]; then args+=(--rosters); fi
          python3 updater/refresh.py "${args[@]}"
      - name: Aggiorna Formula 1
        id: f1
        continue-on-error: true
        run: |
          node --test updater/test_f1.mjs
          node updater/f1.mjs
      - name: Salva i dati verificati
        run: |
          git config user.name 'QuiSport Data'
          git config user.email 'quisport-data@users.noreply.github.com'
          # SportScore permits site display, but not public bulk datasets.
          git add dist/data ':!dist/data/aa118803c292568d.json' ':!dist/data/54ded8193f16459a.json' ':!dist/data/bfa814178ca6b5fa.json'
          if [ -f dist/f1-data.json ]; then git add dist/f1-data.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna dati sportivi verificati'
            git -c rebase.autoStash=true pull --rebase origin main
            git push
          fi
      - name: Pubblica su Cloudflare
        env:
          QUISPORT_UPDATE_URL: ${{ secrets.QUISPORT_UPDATE_URL }}
          QUISPORT_UPDATE_TOKEN: ${{ secrets.QUISPORT_UPDATE_TOKEN }}
        run: python3 updater/publish.py
      - name: Segnala problemi persistenti o errori interni
        if: steps.update.outcome == 'failure' || steps.f1.outcome == 'failure'
        run: exit 1
